name: Build and Release Roxy Room

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Roxy Room
        run: |
          New-Item -ItemType Directory -Force -Path bin
          rc /fo bin\app.res src\app.rc
          cl /EHsc /std:c++17 /utf-8 /O2 /Ot /Oi /Gy /Gw /fp:fast /W1 `
             src\main.cpp `
             src\TrayIcon.cpp `
             src\HotkeyManager.cpp `
             src\AudioExclusionCapturer.cpp `
             src\DXGICapturer.cpp `
             src\WebStreamServer.cpp `
             src\D3D11Renderer.cpp `
             src\NativePlayerWindow.cpp `
             bin\app.res `
             /I src /I packages\webview2\include `
             /Fe:bin\RoxyRoom.exe `
             /D UNICODE /D _UNICODE `
             /link `
             packages\webview2\lib\WebView2LoaderStatic.lib `
             mmdevapi.lib avrt.lib d3d11.lib dxgi.lib d3dcompiler.lib `
             ws2_32.lib advapi32.lib crypt32.lib user32.lib shell32.lib ole32.lib gdi32.lib `
             shlwapi.lib version.lib dwmapi.lib `
             /SUBSYSTEM:WINDOWS /ENTRY:WinMainCRTStartup /OPT:REF /OPT:ICF
          Copy-Item packages\webview2\lib\WebView2Loader.dll bin\ -Force
          Copy-Item -Recurse web bin\web -Force

      - name: Build Installer and Update Package
        run: |
          python tools/package_release.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Roxy Room Setup.exe
            bin/RoxyRoom-Update.zip
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
