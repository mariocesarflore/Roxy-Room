<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Roxy Room - Assistir Transmissão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="peerjs.min.js"></script>
  <script>
    if (typeof Peer === 'undefined') {
      document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\\/script>');
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; }
    body {
      background-color: #060911;
      color: #f8fafc;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: #070a14;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 20;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #818cf8, #38bdf8);
      padding: 1.5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }
    .brand-title span {
      color: #c4b5fd;
    }
    .header-controls { display: flex; align-items: center; gap: 10px; }
    
    .room-tag {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(129, 140, 248, 0.3);
      color: #c4b5fd;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .status-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .main-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }
    #streamVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .unmute-banner {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #ffffff;
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      z-index: 30;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.5);
      border: 1px solid rgba(255,255,255,0.2);
      animation: pulseBanner 1.8s infinite;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    @keyframes pulseBanner {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
    }

    /* Welcome / Room Picker Overlay */
    .hub-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0f1528 0%, #060911 100%);
      color: #f8fafc;
      z-index: 15;
      padding: 20px;
      text-align: center;
      gap: 16px;
    }
    .hub-card {
      background: rgba(12, 18, 34, 0.95);
      border: 1px solid rgba(129, 140, 248, 0.25);
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 30px rgba(99, 102, 241, 0.15);
    }
    .hub-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #818cf8, #38bdf8);
      padding: 2px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }
    .hub-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .hub-card h2 { font-size: 1.3rem; font-weight: 800; color: #f8fafc; }
    .hub-card p { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; }
    
    .room-input-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .room-input-group input {
      flex: 1;
      background: #060913;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 11px 14px;
      color: #f8fafc;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s;
      letter-spacing: 0.5px;
    }
    .room-input-group input:focus { border-color: #818cf8; box-shadow: 0 0 12px rgba(99, 102, 241, 0.25); }
    
    .btn-connect {
      background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 100%);
      color: #121028;
      border: none;
      padding: 11px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(167, 139, 250, 0.3);
    }
    .btn-connect:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(167, 139, 250, 0.5); }

    .player-footer {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 20px;
      background-color: #070a14;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 20;
    }
    .btn-action {
      background: rgba(18, 24, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover { background: rgba(28, 38, 66, 0.8); color: #fff; border-color: rgba(129, 140, 248, 0.3); }
    .btn-action.active { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); color: #34d399; }
    .btn-leave {
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.3);
      color: #fb7185;
    }
    .btn-leave:hover {
      background: rgba(244, 63, 94, 0.25);
      color: #ffffff;
      border-color: rgba(244, 63, 94, 0.6);
    }
  </style>
</head>
<body>

  <header class="player-header">
    <div class="logo-wrap">
      <div class="logo-avatar">
        <img src="brand/roxyroom-logo.png" alt="Roxy Room" />
      </div>
      <div class="brand-title">roxy<span>room</span></div>
    </div>
    <div class="header-controls">
      <div class="room-tag" id="roomTag" style="display: none;">SALA: -</div>
      <div class="status-badge" id="statusBadge">Aguardando Sala</div>
      <button class="btn-action btn-leave" id="leaveHeaderBtn" style="display: none;">🔴 Sair</button>
    </div>
  </header>

  <main class="main-viewport" id="viewportArea">
    <video id="streamVideo" autoplay playsinline webkit-playsinline></video>

    <!-- Tap to Unmute Overlay for Mobile -->
    <div id="unmuteOverlay" class="unmute-banner" style="display: none;">
      🔊 Toque para Ativar o Áudio
    </div>

    <!-- Room Selection Hub Overlay -->
    <div class="hub-overlay" id="hubOverlay">
      <div class="hub-card">
        <div class="hub-avatar">
          <img src="brand/roxyroom-logo.png" alt="Roxy Room" />
        </div>
        <h2>Roxy Room</h2>
        <p>Digite o ID da sala para assistir a transmissão ao vivo:</p>
        
        <div class="room-input-group">
          <input type="text" id="roomInput" placeholder="Ex: SALA-6863" autocomplete="off" autocapitalize="characters">
          <button class="btn-connect" id="btnConnect">Entrar ✦</button>
        </div>

        <small style="color: #64748b; font-size: 0.75rem;">
          ✨ Assista com ultra-baixa latência direto pelo navegador!
        </small>
      </div>
    </div>
  </main>

  <footer class="player-footer">
    <button class="btn-action active" id="audioToggleBtn">🔊 Áudio Ativo</button>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 0.8rem; color: #94a3b8;">Volume:</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" style="width: 80px; accent-color: #818cf8;">
    </div>
    <button class="btn-action btn-leave" id="leaveRoomBtn" style="margin-left: auto;">🔴 Sair da Tela</button>
    <button class="btn-action" id="changeRoomBtn">🚪 Trocar de Sala</button>
    <button class="btn-action" id="fullscreenBtn">⛶ Tela Cheia</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
